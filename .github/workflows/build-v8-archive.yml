name: Build V8 archive

# Compiles rusty_v8 from source inside the manylinux_2_28 containers and
# publishes the static library + src binding as release assets, which wheel
# CI consumes via RUSTY_V8_ARCHIVE. Run manually after the v8 version in
# Cargo.lock changes. (From source because denoland's gnu prebuilts require
# glibc > 2.28; see .github/docker/Dockerfile.x86_64.)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Architecture(s) to build"
        type: choice
        default: all
        options:
          - all
          - x86_64
          - aarch64

permissions:
  contents: write # Required for uploading release assets

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arch == 'all' && '["x86_64","aarch64"]' || format('["{0}"]', inputs.arch)) }}
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5

      # V8 needs ~25GB; free runners start with ~14GB available.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Read v8 version from Cargo.lock
        id: v8
        run: |
          VERSION=$(.github/scripts/v8-version.sh)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building archive for rusty_v8 v$VERSION"

      - name: Build builder image
        run: |
          docker build \
            -t jsrun-v8-builder:${{ matrix.arch }} \
            -f .github/docker/Dockerfile.${{ matrix.arch }} \
            .github/docker/

      - name: Build V8 from source
        run: |
          mkdir -p dist-v8
          docker run --rm \
            -v "$(pwd):/workdir" \
            -w /workdir \
            jsrun-v8-builder:${{ matrix.arch }} \
            bash .github/scripts/build-v8-archive.sh "$TARGET" dist-v8

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Prerelease, and deliberately not matching the v* pattern that
          # triggers release CI.
          TAG="librusty_v8-v${{ steps.v8.outputs.version }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --prerelease \
              --title "librusty_v8 v${{ steps.v8.outputs.version }} (manylinux_2_28)" \
              --notes "Prebuilt rusty_v8 static libraries compiled inside manylinux_2_28 containers (glibc 2.28 compatible). Consumed by the wheel CI via RUSTY_V8_ARCHIVE." \
            || true
          gh release upload "$TAG" dist-v8/* --clobber
