name: CI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # Required for creating releases
  id-token: write  # Required for PyPI trusted publishing

jobs:

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15
            target: aarch64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
      - uses: astral-sh/setup-uv@v7
      # Rust version comes from rust-toolchain.toml via the preinstalled rustup.
      - name: Test
        run: make all
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # Build manylinux wheels against the prebuilt V8 archive published by the
  # "Build V8 archive" workflow (V8 only compiles when Cargo.lock bumps it).
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: aarch64
    steps:
      - uses: actions/checkout@v5

      - name: Resolve prebuilt V8 archive
        id: v8
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(.github/scripts/v8-version.sh)
          TAG="librusty_v8-v${VERSION}"
          echo "Using prebuilt V8 archive release: $TAG"
          mkdir -p .v8
          if ! gh release download "$TAG" --repo "${{ github.repository }}" \
               --pattern "src_binding_release_${{ matrix.platform.target }}.rs" --dir .v8; then
            echo "::error::Missing release $TAG (asset src_binding_release_${{ matrix.platform.target }}.rs). Run the 'Build V8 archive' workflow after bumping v8 in Cargo.lock."
            exit 1
          fi
          echo "archive_url=https://github.com/${{ github.repository }}/releases/download/${TAG}/librusty_v8_release_${{ matrix.platform.target }}.a.gz" >> "$GITHUB_OUTPUT"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          RUSTY_V8_ARCHIVE: ${{ steps.v8.outputs.archive_url }}
          RUSTY_V8_SRC_BINDING_PATH: ${{ github.workspace }}/.v8/src_binding_release_${{ matrix.platform.target }}.rs
        with:
          target: ${{ matrix.platform.target }}
          manylinux: 2_28
          args: --release --out dist
          docker-options: -e RUSTY_V8_ARCHIVE -e RUSTY_V8_SRC_BINDING_PATH
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.arch }}
          path: dist

  # Build musllinux wheels. denoland ships musl prebuilts (no glibc-style
  # symbol versioning), which rusty_v8's build script downloads automatically.
  linux-musl:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            arch: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: aarch64
    steps:
      - uses: actions/checkout@v5
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          # Extension modules need dynamic musl; Rust's musl targets default to static crt.
          RUSTFLAGS: -C target-feature=-crt-static
        with:
          target: ${{ matrix.platform.target }}
          manylinux: musllinux_1_2
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-musllinux-${{ matrix.platform.arch }}
          path: dist

  # Test built manylinux wheels against all supported Python versions.
  # A single cp310-abi3 wheel per architecture covers 3.10+.
  test-wheels-x86_64:
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download wheels
        uses: actions/download-artifact@v6
        with:
          name: wheels-linux-x86_64
          path: dist
      - name: Install and test wheel
        run: |
          python -m pip install --upgrade pip
          WHEEL=$(ls dist/*cp310-abi3*x86_64.whl | head -n 1)
          echo "Installing wheel: $WHEEL"
          pip install "$WHEEL"
          pip install pytest pytest-asyncio
          pytest tests/ -v

  test-wheels-aarch64:
    needs: linux
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download wheels
        uses: actions/download-artifact@v6
        with:
          name: wheels-linux-aarch64
          path: dist
      - name: Install and test wheel
        run: |
          python -m pip install --upgrade pip
          WHEEL=$(ls dist/*cp310-abi3*aarch64.whl | head -n 1)
          echo "Installing wheel: $WHEEL"
          pip install "$WHEEL"
          pip install pytest pytest-asyncio
          pytest tests/ -v

  # Test musllinux wheels inside Alpine containers (run via docker rather
  # than `container:` because node-based actions cannot execute on musl).
  test-wheels-musl:
    needs: linux-musl
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5
      - name: Download wheels
        uses: actions/download-artifact@v6
        with:
          name: wheels-musllinux-${{ matrix.platform.arch }}
          path: dist
      - name: Test wheel in Alpine container
        run: |
          WHEEL=$(ls dist/*cp310-abi3*musllinux*${{ matrix.platform.arch }}.whl | head -n 1)
          echo "Testing wheel: $WHEEL"
          docker run --rm \
            -v "$(pwd):/work" -w /work \
            python:${{ matrix.python-version }}-alpine \
            sh -c "pip install --upgrade pip && pip install $WHEEL pytest pytest-asyncio && pytest tests/ -q"

  # Create GitHub Release with all artifacts
  release:
    needs: [macos, sdist, linux, linux-musl, test-wheels-x86_64, test-wheels-aarch64, test-wheels-musl]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -name '*.whl' -exec cp {} release-assets/ \;
          find artifacts -name '*.tar.gz' -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Publish to PyPI using trusted publishing
  publish:
    needs: [release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/p/jsrun
    permissions:
      id-token: write  # Required for PyPI trusted publishing
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Prepare distribution files
        run: |
          mkdir -p dist
          find artifacts -name '*.whl' -exec cp {} dist/ \;
          find artifacts -name '*.tar.gz' -exec cp {} dist/ \;
          ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
