name: Verify V8 archive

# Proves a librusty_v8 archive is linkable in the wheel target environment:
# a whole-archive -Wl,-z,defs link makes the same demand the wheel link does.
# gnu legs verify OUR archives against glibc 2.28; musl legs verify
# denoland's upstream prebuilts, which the musl wheel builds consume directly.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v8-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v8.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v8
        run: echo "version=$(.github/scripts/v8-version.sh)" >> "$GITHUB_OUTPUT"

  # Container job uses only `run:` steps: node-based actions (checkout etc.)
  # cannot execute inside musl containers (the runner's node is glibc-linked).
  verify:
    needs: v8-version
    runs-on: ${{ matrix.target.runner }}
    container: ${{ matrix.target.container }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: gnu-x86_64
            runner: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            triple: x86_64-unknown-linux-gnu
            source: self
            extra_libs: "-lrt -lgcc_s"
          - name: musl-x86_64
            runner: ubuntu-latest
            container: quay.io/pypa/musllinux_1_2_x86_64
            triple: x86_64-unknown-linux-musl
            source: upstream
            extra_libs: ""
          - name: musl-aarch64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/musllinux_1_2_aarch64
            triple: aarch64-unknown-linux-musl
            source: upstream
            extra_libs: ""
    steps:
      - name: Show toolchain and libc
        run: |
          (ldd --version 2>&1 || true) | head -1
          gcc --version | head -1

      - name: Download archive
        run: |
          VERSION="${{ needs.v8-version.outputs.version }}"
          echo "v8 version: $VERSION"
          if [ "${{ matrix.target.source }}" = "self" ]; then
            BASE="https://github.com/${{ github.repository }}/releases/download/librusty_v8-v${VERSION}"
          else
            BASE="https://github.com/denoland/rusty_v8/releases/download/v${VERSION}"
          fi
          curl -sSfL -o librusty_v8.a.gz \
            "${BASE}/librusty_v8_release_${{ matrix.target.triple }}.a.gz"
          gunzip librusty_v8.a.gz
          ls -lh librusty_v8.a

      - name: Whole-archive link test (-z,defs)
        run: |
          # C++->Rust FFI hooks are intentionally undefined (cargo provides
          # them at the real link). Collect missing symbols, assert all are
          # first-party FFI names (anything else fails), then stub and re-link.
          link() {
            gcc -shared -o /tmp/librusty_v8_test.so \
              -Wl,--whole-archive librusty_v8.a -Wl,--no-whole-archive \
              "$@" \
              -Wl,-z,defs \
              -lpthread -ldl -lm ${{ matrix.target.extra_libs }}
          }
          if link 2>link_err.txt; then
            echo "Linked with no stubs needed"
          else
            awk -F'`' '/undefined reference to/{split($2,a,"\x27"); print a[1]}' link_err.txt \
              | sort -u > missing_syms.txt
            echo "Missing symbols: $(wc -l < missing_syms.txt)"
            NON_FFI=$(grep -vE '^(temporal_rs_|rusty_v8_|v8__|v8_inspector__|cppgc__|crdtp__)' missing_syms.txt || true)
            if [ -n "${NON_FFI}" ]; then
              echo "ERROR: unresolved symbols that are NOT first-party Rust FFI (likely libc incompatibility):"
              echo "${NON_FFI}"
              exit 1
            fi
            awk '{print "void "$1"(void) {}"}' missing_syms.txt > stubs.c
            gcc -c stubs.c -o stubs.o
            link stubs.o
          fi
          ls -lh /tmp/librusty_v8_test.so
          echo "Whole-archive link succeeded on ${{ matrix.target.name }}"

      - name: Inspect resulting shared object
        run: |
          echo "=== versioned symbol requirements (empty on musl) ==="
          objdump -T /tmp/librusty_v8_test.so | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -5 || true
          echo "=== NEEDED libraries ==="
          objdump -p /tmp/librusty_v8_test.so | grep NEEDED
